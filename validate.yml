name: Validate benchmark.csv

on:
  pull_request:
    paths:
      - 'results/benchmark.csv'
      - 'docs/benchmark_registry.json'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Run CSV validator
        run: python scripts/validate_csv.py

      - name: Comment on PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('validate_output.json')) return;
            const result = JSON.parse(fs.readFileSync('validate_output.json', 'utf8'));
            const icon = result.passed ? '✅' : '❌';
            const body = `${icon} **CSV Validation ${result.passed ? 'passed' : 'failed'}**\n\n${result.summary}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
